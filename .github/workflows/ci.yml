name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Public placeholders so config validation passes; never real values.
      EXPO_PUBLIC_API_URL: https://api.example.invalid
      EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm test -- --ci
      - name: Bundle (iOS + Android)
        run: npx expo export --platform ios --platform android --output-dir dist
